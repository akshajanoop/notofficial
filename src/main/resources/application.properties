# ==============================================================
# Movie Ticket Booking System - Application Configuration
# ==============================================================

# Server Configuration
server.port=8080

# -----------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------
# 1. Persistent File-Based Database (Survives server restarts and recompilations!)
#    Stores database files permanently in the local project directory under ./data/
# -----------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/movie_booking_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically ensure schema tables exist (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=
# Data seeding is managed conditionally by DatabaseConfig.java:
# Initial sample data is seeded only when the database is empty, preserving all admin entries permanently across restarts!

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -----------------------------------------------------------------
# Optional MySQL Configuration:
# To use MySQL instead, uncomment below and comment the H2 settings:
# -----------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# DevTools Configuration - Exclude database files from triggering live server restart
spring.devtools.restart.exclude=data/**,data/*,**/*.mv.db,static/**

# Loyalty Credit Rules
app.credits.earn-rate=0.10
app.credits.point-value=1.00
