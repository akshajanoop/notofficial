# ==============================================================
# Movie Ticket Booking System - Application Configuration
# ==============================================================

# Server Configuration
server.port=8080

# -----------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------
# 1. Active Profile: Defaulting to embedded H2 (MySQL Mode) so the app 
#    starts up immediately without requiring MySQL server to be installed!
# -----------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:movie_booking_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically initialize schema and seed data into H2 on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -----------------------------------------------------------------
# Optional MySQL Configuration:
# To use MySQL instead, uncomment below and comment the H2 settings:
# -----------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Loyalty Credit Rules
app.credits.earn-rate=0.10
app.credits.point-value=1.00
