<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register Account')}"></head>
<body class="bg-dark text-light">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4" data-reveal>
            <div class="card glass-card shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3 mb-2" style="width: 72px; height: 72px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border);">
                            <i class="bi bi-person-plus fs-1"></i>
                        </div>
                        <h3 class="fw-bold text-white mt-2 font-heading">Create Account</h3>
                        <p class="text-secondary small">Join now &amp; get <span class="text-accent fw-semibold">50 Loyalty Credits</span> on sign-up!</p>
                    </div>

                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small" th:text="${errorMsg}"></div>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preferred City</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                <input class="form-control" list="indianCities" name="city" placeholder="Search or select an Indian city..." required autocomplete="off">
                                <datalist id="indianCities">
                                    <option value="Agra"></option>
                                    <option value="Ahmedabad"></option>
                                    <option value="Ajmer"></option>
                                    <option value="Aligarh"></option>
                                    <option value="Allahabad (Prayagraj)"></option>
                                    <option value="Amravati"></option>
                                    <option value="Amritsar"></option>
                                    <option value="Asansol"></option>
                                    <option value="Aurangabad (Chhatrapati Sambhajinagar)"></option>
                                    <option value="Bareilly"></option>
                                    <option value="Belgaum"></option>
                                    <option value="Bengaluru (Bangalore)"></option>
                                    <option value="Bhavnagar"></option>
                                    <option value="Bhilai"></option>
                                    <option value="Bhiwandi"></option>
                                    <option value="Bhopal"></option>
                                    <option value="Bhubaneswar"></option>
                                    <option value="Bikaner"></option>
                                    <option value="Chandigarh"></option>
                                    <option value="Chennai"></option>
                                    <option value="Coimbatore"></option>
                                    <option value="Cuttack"></option>
                                    <option value="Dehradun"></option>
                                    <option value="Delhi NCR"></option>
                                    <option value="Dhanbad"></option>
                                    <option value="Durgapur"></option>
                                    <option value="Faridabad"></option>
                                    <option value="Firozabad"></option>
                                    <option value="Ghaziabad"></option>
                                    <option value="Goa (Panaji)"></option>
                                    <option value="Gorakhpur"></option>
                                    <option value="Gulbarga"></option>
                                    <option value="Guntur"></option>
                                    <option value="Gurugram (Gurgaon)"></option>
                                    <option value="Guwahati"></option>
                                    <option value="Gwalior"></option>
                                    <option value="Hubli-Dharwad"></option>
                                    <option value="Hyderabad"></option>
                                    <option value="Indore"></option>
                                    <option value="Jabalpur"></option>
                                    <option value="Jaipur"></option>
                                    <option value="Jalandhar"></option>
                                    <option value="Jalgaon"></option>
                                    <option value="Jammu"></option>
                                    <option value="Jamnagar"></option>
                                    <option value="Jamshedpur"></option>
                                    <option value="Jhansi"></option>
                                    <option value="Jodhpur"></option>
                                    <option value="Kannur"></option>
                                    <option value="Kanpur"></option>
                                    <option value="Kochi (Cochin)"></option>
                                    <option value="Kolhapur"></option>
                                    <option value="Kolkata"></option>
                                    <option value="Kollam"></option>
                                    <option value="Kota"></option>
                                    <option value="Kozhikode (Calicut)"></option>
                                    <option value="Lucknow"></option>
                                    <option value="Ludhiana"></option>
                                    <option value="Madurai"></option>
                                    <option value="Mangaluru (Mangalore)"></option>
                                    <option value="Meerut"></option>
                                    <option value="Moradabad"></option>
                                    <option value="Mumbai"></option>
                                    <option value="Mysuru (Mysore)"></option>
                                    <option value="Nagpur"></option>
                                    <option value="Nanded"></option>
                                    <option value="Nashik"></option>
                                    <option value="Navi Mumbai"></option>
                                    <option value="Noida"></option>
                                    <option value="Patna"></option>
                                    <option value="Pondicherry (Puducherry)"></option>
                                    <option value="Pune"></option>
                                    <option value="Raipur"></option>
                                    <option value="Rajahmundry"></option>
                                    <option value="Rajkot"></option>
                                    <option value="Ranchi"></option>
                                    <option value="Rourkela"></option>
                                    <option value="Salem"></option>
                                    <option value="Saharanpur"></option>
                                    <option value="Sangli"></option>
                                    <option value="Shimla"></option>
                                    <option value="Siliguri"></option>
                                    <option value="Solapur"></option>
                                    <option value="Srinagar"></option>
                                    <option value="Surat"></option>
                                    <option value="Thane"></option>
                                    <option value="Thiruvananthapuram (Trivandrum)"></option>
                                    <option value="Thrissur"></option>
                                    <option value="Tiruchirappalli (Trichy)"></option>
                                    <option value="Tirunelveli"></option>
                                    <option value="Tirupati"></option>
                                    <option value="Udaipur"></option>
                                    <option value="Ujjain"></option>
                                    <option value="Vadodara"></option>
                                    <option value="Varanasi"></option>
                                    <option value="Vasai-Virar"></option>
                                    <option value="Vijayawada"></option>
                                    <option value="Visakhapatnam"></option>
                                    <option value="Warangal"></option>
                                </datalist>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 py-2 fw-bold rounded-pill">
                            <i class="bi bi-check-circle me-1"></i> Join CineReserve
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <span class="small text-secondary">Already have an account? </span>
                        <a th:href="@{/login}" class="small text-accent fw-bold text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
