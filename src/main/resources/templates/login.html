<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign In')}"></head>
<body class="bg-light">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-film text-danger display-4"></i>
                        <h4 class="fw-bold mt-2">Welcome Back</h4>
                        <p class="text-muted small">Sign in to book tickets & place live bids</p>
                    </div>

                    <div th:if="${successMsg}" class="alert alert-success py-2 small" th:text="${successMsg}"></div>
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small" th:text="${errorMsg}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" value="alice@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" value="password123" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign In</button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="small text-muted">Don't have an account? </span>
                        <a th:href="@{/register}" class="small text-danger fw-semibold text-decoration-none">Create Account</a>
                    </div>
                </div>
            </div>
            
            <div class="card bg-white mt-3 border-0 shadow-sm p-3 small text-muted">
                <strong>Demo Accounts:</strong><br>
                • <strong>Customer:</strong> <code>alice@example.com</code> / <code>password123</code><br>
                • <strong>Admin:</strong> <code>admin@cinereserve.com</code> / <code>admin123</code>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
